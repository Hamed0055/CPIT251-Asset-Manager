name: Build and verify Windows executable
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools on the runner
        run: python -m pip install -r requirements-dev.txt
      - name: Run isolated native Windows tests
        run: python -m pytest -q
      - name: Build and test the frozen GUI
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SmokeTest
      - name: Upload executable and native smoke receipt
        uses: actions/upload-artifact@v6
        with:
          name: CPIT251-Asset-Manager-Windows-x64
          path: |
            dist/CPIT251-Asset-Manager.exe
            dist/windows-smoke.json
            dist/windows.bat
            dist/CPIT251-Asset-Manager-Windows-x64.zip
          if-no-files-found: error
